# PostgreSQL für Entwicklung/Team (Alternative zu `npm run db`, benötigt Docker).
# Danach in backend/.env setzen:
#   DATABASE_URL=postgresql://oncoplan:oncoplan@localhost:5432/oncoplan?schema=public
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oncoplan
      POSTGRES_PASSWORD: oncoplan
      POSTGRES_DB: oncoplan
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - oncoplan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oncoplan -d oncoplan']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oncoplan-pgdata:
